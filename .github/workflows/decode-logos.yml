name: Decode logo PNGs
on:
  push:
    paths:
      - "logos-b64/**"
      - ".github/workflows/decode-logos.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 logos into PNGs
        run: |
          set -euo pipefail
          for f in logos-b64/*.b64; do
            name="$(basename "$f" .b64)"
            base64 -d "$f" > "$name"
            file "$name"
          done
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sig-*.png
          if git diff --cached --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Add decoded signature logo PNGs"
          git push
